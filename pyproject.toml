[project]
name = "qar"
version = "0.1.0"
description = "Review-grounded product question answering on AmazonQA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "tokenizers>=0.21",
    "tqdm>=4.67",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
# Pulled in for the NLP-report half (generation, pretrained baselines).
nlp = [
    "transformers>=4.50",
    "sentence-transformers>=3.4",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
