# Shared defaults. Ablation configs inherit with `_base_: base.yaml` and override
# only the field under test, so a diff between two configs is the experiment.
name: base
task: dev_toy
seed: 42
deterministic: false
device: auto
out_dir: runs

data:
  train_path: train-qar.jsonl
  val_path: val-qar.jsonl
  test_path: test-qar_all.jsonl   # null -> carve test out of val by hashed asin
  processed_dir: data/processed
  batch_size: 64
  eval_batch_size: 128
  num_workers: 0
  max_query_len: 64
  max_doc_len: 128
  train_subset: null
  val_subset: 4096
  dedup_questions_in_batch: true

# Offline corpus preparation; read by scripts/prepare_data.py only.
prepare:
  selector: answer_overlap
  min_positive_score: 0.10
  min_snippet_tokens: 5
  max_snippets: 32
  test_fraction: 0.5              # only used when data.test_path is null
  split_seed: 20260731
  tokenizer_sample_docs: 400000
  max_rows: null

model:
  name: dev_toy
  d_model: 384
  n_layers: 6
  n_heads: 8
  d_ff: 1536
  dropout: 0.1
  vocab_size: 32000
  max_len: 128
  pooling: mean
  pretrained: null

loss:
  temperature: 0.05
  answerable_weight: 0.0
  hard_negatives: 0

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-8
  grad_clip: 1.0
  scheduler: cosine
  warmup_ratio: 0.06

train:
  max_steps: 10000
  grad_accum: 1
  log_every: 50
  eval_every: 500
  save_every: 1000
  save_every_minutes: 10.0   # wall-clock floor; 0 disables
  keep_last: 2
  monitor: val/recall@1
  monitor_mode: max
  early_stop_patience: 0
  amp: bf16
  grad_checkpoint: false
  compile: false
