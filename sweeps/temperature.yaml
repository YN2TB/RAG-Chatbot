# InfoNCE temperature. The one knob that changes nothing but the shape of the
# softmax, so it isolates "how sharply must the objective separate candidates?"
#
# Ranked on within-product recall@1, not the in-batch number in metrics.jsonl --
# see `evaluate:` below.
config: configs/retriever.yaml
prefix: temp
monitor: val/recall@1        # in-batch; kept as a training-health signal only
monitor_mode: max

grid:
  loss.temperature: [0.02, 0.05, 0.1]

fixed:
  - data.batch_size=128
  - train.max_steps=12000   # measured convergence length; see CLAUDE.md
  - loss.hard_negatives=2

# Score every cell's best.pt through the same within-product path as the baseline
# table. Full split, no max_rows: dense evaluation is ~3.5 min per cell since
# length-sorted batching, so approximating buys nothing and costs comparability
# with the baseline table, which is measured on all 87,475 rows.
evaluate:
  split: val
