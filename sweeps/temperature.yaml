# Example ablation: InfoNCE temperature. Swap in the real config once the
# retriever task exists; the harness and the table are already wired.
config: configs/dev.yaml
prefix: temp
monitor: val/recall@1
monitor_mode: max

grid:
  loss.temperature: [0.01, 0.05, 0.2]

# Applied to every cell in the grid.
fixed:
  - train.max_steps=300
